name: Build TakaGuchhi APK

on:
  push:
    paths:
      - 'TakaGuchhi-Android.zip'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          unzip -o -q TakaGuchhi-Android.zip -d "$RUNNER_TEMP/takaguchhi-project"
          project_dir="$RUNNER_TEMP/takaguchhi-project"
          if [ ! -f "$project_dir/settings.gradle.kts" ] || [ ! -f "$project_dir/app/build.gradle.kts" ]; then
            echo "::error::The Android project ZIP is incomplete."
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p "$ANDROID_PROJECT_DIR" assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: takaguchhi-debug-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
